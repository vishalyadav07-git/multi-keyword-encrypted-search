<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureSearch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->

        <header>

            <h1>🔐 SecureSearch</h1>

            <p>
                Multi-Keyword Ranked Search over Encrypted Data
            </p>

        </header>


        <!-- Add Document -->

        <section class="card">

            <h2>📄 Add New Document</h2>

            <input
                type="text"
                id="documentTitle"
                placeholder="Enter document title"
            >

            <textarea
                id="documentContent"
                placeholder="Enter document content..."
                rows="6"
            ></textarea>

            <button
                class="primary-button"
                onclick="addDocument()"
            >
                ➕ Add Document
            </button>

            <p id="uploadMessage"></p>

        </section>


        <!-- Search -->

        <section class="card">

            <h2>🔎 Search Encrypted Documents</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Example: python fastapi"
                    onkeydown="handleSearchKey(event)"
                >

                <select id="searchMode">

                    <option value="OR">
                        OR
                    </option>

                    <option value="AND">
                        AND
                    </option>

                </select>

                <button
                    class="primary-button"
                    onclick="searchDocuments()"
                >
                    Search
                </button>

            </div>

        </section>


        <!-- Results -->

        <section
            id="results"
            class="card"
        >

            <h2>📊 Search Results</h2>

            <p class="empty-message">
                Enter keywords to search your encrypted documents.
            </p>

        </section>

    </div>


    <!-- Document Modal -->

    <div
        id="documentModal"
        class="modal"
    >

        <div class="modal-content">

            <span
                class="close"
                onclick="closeModal()"
            >
                &times;
            </span>

            <h2 id="modalTitle"></h2>

            <div
                id="modalContent"
                class="document-content"
            ></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
